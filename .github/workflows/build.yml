name: Build Lancelot WiFi Modules

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential bc bison flex libssl-dev libelf-dev gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi zip python2 python3 curl

      - name: Setup Compiler
        run: |
          git clone --depth=1 https://github.com/kdrag0n/proton-clang.git clang-llvm
          rm -f clang-llvm/bin/as clang-llvm/bin/ld

      - name: Clone Xiaomi Lancelot Q Kernel Source
        run: |
          git clone --depth=1 https://github.com/android-kernels/xiaomi-lancelot-q-oss.git kernel_source
          cd kernel_source
          git clone https://android.googlesource.com/platform/system/libufdt scripts/ufdt/libufdt
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.l || true
          sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' scripts/dtc/dtc-lexer.lex.c_shipped || true

      - name: Extract MT76 / MT7612U Source
        run: |
          mkdir -p kernel_source/drivers/net/wireless/mediatek/mt76
          unzip -o mt76_src.zip -d kernel_source/drivers/net/wireless/mediatek/mt76
          
          # Fix Makefile to always compile mt76 drivers as modules
          cat << 'EOF' > kernel_source/drivers/net/wireless/mediatek/mt76/Makefile
          obj-m += mt76.o
          obj-m += mt76-usb.o
          obj-m += mt76x2-common.o
          obj-m += mt76x2u.o

          mt76-y := mmio.o util.o trace.o dma.o mac80211.o debugfs.o eeprom.o tx.o agg-rx.o
          mt76-usb-y := usb.o usb_trace.o usb_mcu.o
          CFLAGS_trace.o := -I\$(src) -I\$(srctree)/\$(src)
          CFLAGS_usb_trace.o := -I\$(src) -I\$(srctree)/\$(src)

          mt76x2-common-y := mt76x2_eeprom.o mt76x2_tx_common.o mt76x2_mac_common.o mt76x2_init_common.o mt76x2_common.o mt76x2_phy_common.o mt76x2_debugfs.o
          mt76x2u-y := mt76x2_usb.o mt76x2u_init.o mt76x2u_main.o mt76x2u_mac.o mt76x2u_mcu.o mt76x2u_phy.o mt76x2u_core.o
          CFLAGS_mt76x2_trace.o := -I\$(src) -I\$(srctree)/\$(src)
          EOF
          sed -i 's/^[ \t]*//' kernel_source/drivers/net/wireless/mediatek/mt76/Makefile

          echo 'obj-$(CONFIG_MT7601U) += mt76/' >> kernel_source/drivers/net/wireless/mediatek/Makefile
          find kernel_source -exec touch {} +

      - name: Configure and Build Kernel Modules
        run: |
          export PATH="$(pwd)/clang-llvm/bin:${PATH}"
          cd kernel_source
          make O=out ARCH=arm64 HOSTCFLAGS="-fcommon" lancelot_defconfig
          scripts/config --file out/.config \
            -d CONFIG_CC_STACKPROTECTOR_STRONG \
            -e CONFIG_CC_STACKPROTECTOR_NONE \
            -e CONFIG_MODULES \
            -e CONFIG_MODVERSIONS \
            -m CONFIG_MAC80211 \
            -e CONFIG_MAC80211_RC_MINSTREL \
            -e CONFIG_MAC80211_RC_MINSTREL_HT \
            -e CONFIG_MAC80211_LEDS \
            -m CONFIG_RT2X00 \
            -m CONFIG_RT2X00_LIB \
            -m CONFIG_RT2X00_LIB_USB \
            -m CONFIG_RT2800USB \
            -e CONFIG_RT2800USB_RT53XX \
            -m CONFIG_ATH_COMMON \
            -m CONFIG_ATH9K_HW \
            -m CONFIG_ATH9K_COMMON \
            -m CONFIG_ATH9K_HTC \
            -d CONFIG_ATH9K_COMMON_SPECTRAL \
            -d CONFIG_ATH9K_DEBUGFS \
            -d CONFIG_ATH9K_HTC_DEBUGFS \
            -e CONFIG_WLAN_VENDOR_MEDIATEK \
            -m CONFIG_MT7601U \
            -e CONFIG_STAGING \
            -m CONFIG_R8188EU \
            -e CONFIG_88EU_AP_MODE \
            -m CONFIG_RTL8XXXU \
            -e CONFIG_RTL8XXXU_UNTESTED \
            -e CONFIG_CFG80211 \
            -e CONFIG_CFG80211_WEXT
          make O=out ARCH=arm64 HOSTCFLAGS="-fcommon" olddefconfig
          make -j$(nproc --all) O=out \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            CROSS_COMPILE_ARM32=arm-linux-gnueabi- \
            AR=llvm-ar \
            OBJDUMP=llvm-objdump \
            STRIP=llvm-strip \
            HOSTCFLAGS="-fcommon" \
            modules 2>&1 | tee ../build.log

      - name: Build Realtek RTL8812AU (AC1200 5GHz)
        run: |
          export PATH="$(pwd)/clang-llvm/bin:${PATH}"
          git clone --depth=1 https://github.com/aircrack-ng/rtl8812au.git rtl8812au
          cd rtl8812au
          sed -i 's/CONFIG_PLATFORM_I386_PC = y/CONFIG_PLATFORM_I386_PC = n/' Makefile
          sed -i 's/CONFIG_PLATFORM_ARM64_RPI = n/CONFIG_PLATFORM_ARM64_RPI = y/' Makefile
          sed -i '/stringop-overread/d' Makefile
          sed -i 's/-Werror//g' Makefile
          make -j$(nproc --all) \
            KSRC="$(pwd)/../kernel_source/out" \
            ARCH=arm64 \
            CC=clang \
            CLANG_TRIPLE=aarch64-linux-gnu- \
            CROSS_COMPILE=aarch64-linux-gnu- \
            USER_EXTRA_CFLAGS="-Wno-unknown-warning-option -Wno-error" \
            modules 2>&1 | tee ../build_rtl8812au.log || true

      - name: Collect Modules and Firmwares
        run: |
          mkdir -p modules
          mkdir -p modules/firmware
          find kernel_source/out/ -name "*.ko" -exec cp {} modules/ \;
          find rtl8812au/ -name "*.ko" -exec cp {} modules/ \; || true
          
          # Download common firmwares
          curl -sL https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_9271-1.4.0.fw -o modules/firmware/htc_9271.fw || true
          curl -sL https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/ath9k_htc/htc_7010-1.4.0.fw -o modules/firmware/htc_7010.fw || true
          curl -sL https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mt7601u.bin -o modules/firmware/mt7601u.bin || true
          curl -sL https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rtlwifi/rtl8188eufw.bin -o modules/firmware/rtl8188eufw.bin || true
          curl -sL https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/rt2870.bin -o modules/firmware/rt2870.bin || true
          curl -sL https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7662u.bin -o modules/firmware/mt7662u.bin || true
          curl -sL https://git.kernel.org/pub/scm/linux/kernel/git/firmware/linux-firmware.git/plain/mediatek/mt7662u_rom_patch.bin -o modules/firmware/mt7662u_rom_patch.bin || true

          cd modules
          ls -la
          ls -la firmware/
          zip -r ../lancelot_wifi_modules.zip ./*

      - name: Upload Modules Artifact
        uses: actions/upload-artifact@v4
        with:
          name: lancelot-wifi-modules
          path: lancelot_wifi_modules.zip

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
